services:
  web:
    init: true
    image: 'ghcr.io/usetrmnl/terminus:latest'
    environment:
      HANAMI_PORT: 2300
      API_URI: '${APP_PROTOCOL}://${APP_DOMAIN}'
      APP_SECRET: '${APP_SECRET}'
      APP_SETUP: 'true'
      DATABASE_URL: 'postgres://terminus:${DATABASE_PASSWORD}@database:5432/terminus'
      KEYVALUE_URL: 'redis://:${KEYVALUE_PASSWORD}@keyvalue:6379/0'
    restart: unless-stopped
    volumes:
      - '${APP_DATA_DIR}/fonts:/app/public/fonts'
      - '${APP_DATA_DIR}/fonts:/usr/share/fonts/terminus'
      - '${APP_DATA_DIR}/uploads:/app/public/uploads'
    depends_on:
      database:
        condition: service_healthy
      keyvalue:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:2300/up']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    x-runtipi:
      is_main: true
      internal_port: '2300'

  worker:
    init: true
    image: 'ghcr.io/usetrmnl/terminus:latest'
    environment:
      HANAMI_PORT: 2300
      API_URI: '${APP_PROTOCOL}://${APP_DOMAIN}'
      APP_SECRET: '${APP_SECRET}'
      DATABASE_URL: 'postgres://terminus:${DATABASE_PASSWORD}@database:5432/terminus'
      KEYVALUE_URL: 'redis://:${KEYVALUE_PASSWORD}@keyvalue:6379/0'
    command: bundle exec sidekiq -r ./config/sidekiq.rb
    restart: unless-stopped
    volumes:
      - '${APP_DATA_DIR}/fonts:/app/public/fonts'
      - '${APP_DATA_DIR}/fonts:/usr/share/fonts/terminus'
      - '${APP_DATA_DIR}/uploads:/app/public/uploads'
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'sidekiq']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  database:
    image: 'postgres:18.4-alpine'
    environment:
      POSTGRES_USER: terminus
      POSTGRES_DB: terminus
      POSTGRES_PASSWORD: '${DATABASE_PASSWORD}'
    volumes:
      - '${APP_DATA_DIR}/database:/var/lib/postgresql'
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username terminus --dbname terminus --port 5432']
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  keyvalue:
    image: 'valkey/valkey:9.1-alpine'
    command: >-
      valkey-server --requirepass ${KEYVALUE_PASSWORD} --maxmemory 512mb
      --maxmemory-policy noeviction --port 6379
    restart: unless-stopped
    volumes:
      - '${APP_DATA_DIR}/keyvalue:/data'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${KEYVALUE_PASSWORD}" -p 6379 ping || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

x-runtipi:
  schema_version: 2